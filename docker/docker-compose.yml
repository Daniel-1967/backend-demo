##+++ b/docker/docker-compose.yml
services:
  db:
    image: postgres:16
    container_name: backend-demo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_demo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
