## b/.github/workflows/ci.yml

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: backend_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/backend_demo
      WEBHOOK_SECRET: change_me
      ENV: test
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Migrate DB
        run: |
          alembic upgrade head
      - name: Run tests
        run: |
          pytest -q